services:
  app:
    build: ./
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    container_name: ${CONTAINER_NAME:-commerce_api}
    ports: 
      - ${PORT:-3015}:${PORT:-3015}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15.3-alpine
    env_file:
      - .env
    container_name: ${POSTGRES_NAME:-commerce_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${POSTGRES_DB:-commerce_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-test} -d ${POSTGRES_DB:-commerce_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    profiles: ["quality"]
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
